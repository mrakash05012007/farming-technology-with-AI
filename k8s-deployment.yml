apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriverse-backend
  labels:
    app: agriverse-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agriverse-backend
  template:
    metadata:
      labels:
        app: agriverse-backend
    spec:
      containers:
      - name: backend
        image: agriverse-backend:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        env:
        - name: DATABASE_URL
          value: "sqlite:////data/agriverse.db"
        volumeMounts:
        - name: db-volume
          mountPath: /data
      volumes:
      - name: db-volume
        persistentVolumeClaim:
          claimName: sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agriverse-backend-service
spec:
  selector:
    app: agriverse-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agriverse-frontend
  labels:
    app: agriverse-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agriverse-frontend
  template:
    metadata:
      labels:
        app: agriverse-frontend
    spec:
      containers:
      - name: frontend
        image: agriverse-frontend:latest
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agriverse-frontend-service
spec:
  selector:
    app: agriverse-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agriverse-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agriverse-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agriverse-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: agriverse.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: agriverse-backend-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agriverse-frontend-service
            port:
              number: 80
